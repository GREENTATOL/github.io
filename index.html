<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katakana Vibe - Language Island</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .main-bg {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('beach.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* Cute Floating Turtle Shell Sign on the Left */
        .turtle-shell-title {
            position: absolute;
            top: 12%;
            left: 12%; /* Moved further right so it's not glued to the edge */
            background: radial-gradient(circle at 30% 30%, #d4a373, #8c6239);
            border: 4px solid #4a2e18;
            border-radius: 50% / 40%; /* Gives it an organic dome shell shape */
            padding: 20px 25px;
            text-align: center;
            font-family: 'Georgia', serif;
            font-size: 18px;
            font-weight: bold;
            color: #fdf6e3;
            box-shadow: 0px 8px 0px rgba(0,0,0,0.4), inset 0px 4px 6px rgba(255,255,255,0.3);
            text-shadow: 1px 1px 0px #3b2210;
            pointer-events: none;
            max-width: 260px;
            line-height: 1.4;
            /* Gentle floating bob animation */
            animation: float-shell 3s ease-in-out infinite alternate;
        }

        @keyframes float-shell {
            0% { transform: translateY(0px) rotate(-1deg); }
            100% { transform: translateY(-8px) rotate(1deg); }
        }

        /* General Styling for the Wooden Planks */
        .lang-plank {
            position: absolute;
            background-color: #8b4513; 
            color: #fdf6e3; 
            padding: 15px 30px;
            border: 4px solid #5c3317; 
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.4);
            text-shadow: 1px 1px 0px #5c3317;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        /* Wiggle Animation on Hover */
        .lang-plank:hover {
            animation: wiggle 0.4s ease-in-out infinite alternate;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.5);
        }

        @keyframes wiggle {
            0% { transform: rotate(0deg) translateY(-5px); }
            100% { transform: rotate(3deg) translateY(-8px); }
        }

        /* --- SEPARATED PLANKS ON THE BEACH --- */
        #plank-japanese {
            top: 50%;  
            left: 20%; /* Moved left */
        }

        #plank-tokpisin {
            top: 70%;
            right: 18%; /* Moved right so they have plenty of space */
        }
    </style>
</head>
<body>

    <div class="main-bg">
        <!-- Cute Floating Turtle Shell Title -->
        <div class="turtle-shell-title">
            🐢 WELCOME TO <br>KATAKANAVIBE ISLAND 🌴
        </div>

        <!-- Plank 1: Learn Japanese -->
        <a href="japanese_beginner.html" id="plank-japanese" class="lang-plank">
            Learn Japanese
        </a>

        <!-- Plank 2: Tok Pisin (Beta) -->
        <a href="tok_pisin_quiz.html" id="plank-tokpisin" class="lang-plank">
            Learn Tok Pisin <span style="font-size: 14px; color: #ffd700;">(Beta)</span>
        </a>
    </div>

</body>
</html>
