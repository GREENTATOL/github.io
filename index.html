
  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katakana Vibe - Language Island</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents scrollbars */
        }

        .main-bg {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* This loads your uploaded beach image */
            background-image: url('KATAKANA MAIN PAGE.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* General Styling for the Wooden Planks */
        .lang-plank {
            position: absolute;
            background-color: #8b4513; /* Rustic wood brown */
            color: #fdf6e3; /* Creamy text */
            padding: 15px 30px;
            border: 4px solid #5c3317; /* Darker wood border */
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.3); /* 3D shadow effect */
            text-shadow: 1px 1px 0px #5c3317;
        }

        .lang-plank:hover {
            transform: translateY(-5px); /* Lift slightly on hover */
            box-shadow: 8px 8px 0px rgba(0,0,0,0.3);
        }

        /* --- POSITIONING THE PLANKS ON THE BEACH --- */
        #plank-japanese {
            top: 55%;  
            left: 32%;
        }

        #plank-tokpisin {
            top: 65%;
            right: 28%;
        }
    </style>
</head>
<body>

    <div class="main-bg">
        <!-- Plank 1: Learn Japanese -->
        <a href="japanese_island.html" id="plank-japanese" class="lang-plank">
            Learn Japanese
        </a>

        <!-- Plank 2: Tok Pisin -->
        <a href="tok_pisin_quiz.html" id="plank-tokpisin" class="lang-plank">
            Learn Tok Pisin
        </a>
    </div>

</body>
</html>
