<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Beginner - Katakana Vibe</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #1a2b3c; /* Deep ocean vibe */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            color: #fdf6e3;
        }

        .container {
            text-align: center;
            background: rgba(139, 69, 19, 0.85);
            padding: 40px;
            border: 4px solid #5c3317;
            border-radius: 15px;
            box-shadow: 0px 10px 0px rgba(0,0,0,0.5);
            max-width: 500px;
        }

        h1 {
            color: #ffd700;
            margin-top: 0;
            text-shadow: 2px 2px 0px #3b2210;
        }

        p {
            font-size: 18px;
            line-height: 1.5;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background-color: #5c3317;
            color: #fdf6e3;
            padding: 10px 20px;
            border: 2px solid #3b2210;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            background-color: #70401d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Japanese Beginner Island 🐢</h1>
        <p>You have successfully hatched onto the Japanese learning path! Next, we will add your turtle egg lessons and characters here.</p>
        
        <a href="index.html" class="back-btn">← Back to Beach</a>
    </div>

</body>
</html>
